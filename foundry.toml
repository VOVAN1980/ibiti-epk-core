[profile.default]
src = "contracts"
test = "test"
script = "scripts"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
ffi = false
verbosity = 2

[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 200

# Lint notes are noisy during build; run `forge lint` explicitly instead
[lint]
lint_on_build = false
