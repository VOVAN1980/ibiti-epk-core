[profile.default]
src = "contracts"
test = "test"
script = "scripts"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Shanghai (PUSH0, EIP-3855): supported by BSC, BSC Testnet, Ethereum and Sepolia; saves ~500 bytes
# of EPKVault (EIP-170). Chains without PUSH0 are not supported.
evm_version = "shanghai"
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
ffi = false
verbosity = 2
# keep storage layouts in artifacts: upgradeable EPKVault releases must be append-only
extra_output = ["storageLayout"]
# EPK v2 contracts are optimized for bytecode size (EIP-170 limit); tests and scripts use the
# default optimizer_runs = 200.
additional_compiler_profiles = [{ name = "v2-size", via_ir = true, optimizer = true, optimizer_runs = 1 }]
compilation_restrictions = [
  { paths = "contracts/v2/**", max_optimizer_runs = 1 },
]

[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 200
# one compiler profile only: with several, coverage source maps mis-attribute lines
additional_compiler_profiles = []
compilation_restrictions = []

# Lint notes are noisy during build; run `forge lint` explicitly instead
[lint]
lint_on_build = false
