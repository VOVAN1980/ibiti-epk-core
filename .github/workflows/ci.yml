name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache forge
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            cache
            out
          key: ${{ runner.os }}-forge-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test/**/*.sol') }}

      - name: Forge build
        run: forge build -vvv

      - name: Forge test
        run: forge test -vvv

      - name: Watchtower unit tests
        run: python3 -m unittest discover -s watchtower -p "test_*.py" -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SDK v2 tests
        working-directory: sdk
        run: |
          npm ci
          npm run typecheck
          npm run test:v2
